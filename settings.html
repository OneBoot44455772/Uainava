<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸鱼小镇 - 设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #ffffff; transition: background 0.5s ease, color 0.3s ease; }
        body { display: flex; flex-direction: column; align-items: center; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

        body.light-mode { background: #ffffff; }
        body.light-mode .top-panel { background: #e8ecf0; }
        body.light-mode .panel-title { color: #1e293b; }
        body.light-mode .panel-btn { background: rgba(255,255,255,0.6); color: #1e293b; }
        body.light-mode .panel-btn:hover { background: rgba(255,255,255,0.9); }
        body.light-mode .settings-page { background: #ffffff; }
        body.light-mode .settings-title { color: #1e293b; }
        body.light-mode .settings-subtitle { color: #94a3b8; }
        body.light-mode .setting-card { background: #f8fafc; border-color: #f1f5f9; }
        body.light-mode .setting-card .label { color: #1e293b; }
        body.light-mode .setting-card .description { color: #94a3b8; }
        body.light-mode .status-text { color: #64748b; }
        body.light-mode .toggle-switch { background: #cbd5e1; }
        body.light-mode .toggle-switch.active { background: #1e293b; }

        body.dark-mode { background: #1a1a2e; }
        body.dark-mode .top-panel { background: #16213e; }
        body.dark-mode .panel-title { color: #ffffff; }
        body.dark-mode .panel-btn { background: rgba(255,255,255,0.15); color: #ffffff; }
        body.dark-mode .panel-btn:hover { background: rgba(255,255,255,0.25); }
        body.dark-mode .settings-page { background: #1a1a2e; }
        body.dark-mode .settings-title { color: #ffffff; }
        body.dark-mode .settings-subtitle { color: #94a3b8; }
        body.dark-mode .setting-card { background: #16213e; border-color: #2a3a5e; }
        body.dark-mode .setting-card .label { color: #ffffff; }
        body.dark-mode .setting-card .description { color: #94a3b8; }
        body.dark-mode .toggle-switch { background: #2a3a5e; }
        body.dark-mode .toggle-switch.active { background: #4a6fa5; }
        body.dark-mode .status-text { color: #94a3b8; }

        body.ocean-mode { background: linear-gradient(135deg, #0c2340 0%, #1a5276 40%, #2e86c1 100%); }
        body.ocean-mode .top-panel { background: rgba(12, 35, 64, 0.85); backdrop-filter: blur(10px); }
        body.ocean-mode .panel-title { color: #e8f4fd; }
        body.ocean-mode .panel-btn { background: rgba(255,255,255,0.15); color: #e8f4fd; }
        body.ocean-mode .panel-btn:hover { background: rgba(255,255,255,0.25); }
        body.ocean-mode .settings-page { background: transparent; }
        body.ocean-mode .settings-title { color: #e8f4fd; }
        body.ocean-mode .settings-subtitle { color: #a8d8ea; }
        body.ocean-mode .setting-card { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        body.ocean-mode .setting-card .label { color: #e8f4fd; }
        body.ocean-mode .setting-card .description { color: #a8d8ea; }
        body.ocean-mode .toggle-switch { background: rgba(255,255,255,0.3); }
        body.ocean-mode .toggle-switch.active { background: #2e86c1; }
        body.ocean-mode .status-text { color: #a8d8ea; }

        body.forest-mode { background: linear-gradient(135deg, #0d2818 0%, #1a4a2a 40%, #2d6a4f 100%); }
        body.forest-mode .top-panel { background: rgba(13, 40, 24, 0.85); backdrop-filter: blur(10px); }
        body.forest-mode .panel-title { color: #e8f5e9; }
        body.forest-mode .panel-btn { background: rgba(255,255,255,0.15); color: #e8f5e9; }
        body.forest-mode .panel-btn:hover { background: rgba(255,255,255,0.25); }
        body.forest-mode .settings-page { background: transparent; }
        body.forest-mode .settings-title { color: #e8f5e9; }
        body.forest-mode .settings-subtitle { color: #a5d6a7; }
        body.forest-mode .setting-card { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        body.forest-mode .setting-card .label { color: #e8f5e9; }
        body.forest-mode .setting-card .description { color: #a5d6a7; }
        body.forest-mode .toggle-switch { background: rgba(255,255,255,0.3); }
        body.forest-mode .toggle-switch.active { background: #2d6a4f; }
        body.forest-mode .status-text { color: #a5d6a7; }

        body.sakura-mode { background: linear-gradient(135deg, #2d1b2e 0%, #5c2e4a 40%, #d4739d 100%); }
        body.sakura-mode .top-panel { background: rgba(45, 27, 46, 0.85); backdrop-filter: blur(10px); }
        body.sakura-mode .panel-title { color: #fce4ec; }
        body.sakura-mode .panel-btn { background: rgba(255,255,255,0.15); color: #fce4ec; }
        body.sakura-mode .panel-btn:hover { background: rgba(255,255,255,0.25); }
        body.sakura-mode .settings-page { background: transparent; }
        body.sakura-mode .settings-title { color: #fce4ec; }
        body.sakura-mode .settings-subtitle { color: #f8bbd0; }
        body.sakura-mode .setting-card { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        body.sakura-mode .setting-card .label { color: #fce4ec; }
        body.sakura-mode .setting-card .description { color: #f8bbd0; }
        body.sakura-mode .toggle-switch { background: rgba(255,255,255,0.3); }
        body.sakura-mode .toggle-switch.active { background: #d4739d; }
        body.sakura-mode .status-text { color: #f8bbd0; }

        .top-panel { width: 100%; border-radius: 0; padding: 1rem 2.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); flex-shrink: 0; position: fixed; top: 0; left: 0; z-index: 100; opacity: 0.92; transition: background 0.5s ease; }
        .panel-left { display: flex; align-items: center; gap: 1.5rem; }
        .panel-right { display: flex; align-items: center; gap: 1rem; }
        .panel-title { display: flex; align-items: center; gap: 0.5rem; font-size: 1.2rem; font-weight: 600; letter-spacing: 0.3px; transition: color 0.3s ease; }
        .panel-title img { width: 28px; height: 28px; display: block; }
        .panel-btn { border: none; border-radius: 9999px; padding: 0.5rem 1.6rem; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; }
        .panel-btn:hover { transform: translateY(-1px); }
        .settings-page { width: 100%; min-height: 100vh; padding: 100px 3rem 3rem; display: flex; flex-direction: column; align-items: center; transition: background 0.5s ease; }
        .settings-header { text-align: center; margin-bottom: 2.5rem; width: 100%; max-width: 700px; }
        .settings-title { font-size: 2.5rem; font-weight: 700; letter-spacing: 2px; transition: color 0.3s ease; }
        .settings-subtitle { font-size: 1rem; margin-top: 0.3rem; transition: color 0.3s ease; }
        .settings-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1.2rem; }
        .setting-card { display: flex; align-items: center; justify-content: space-between; border-radius: 30px; padding: 1.2rem 1.8rem; border: 1px solid; transition: background 0.3s ease, border-color 0.3s ease; }
        .setting-info { display: flex; flex-direction: column; gap: 0.2rem; }
        .setting-card .label { font-size: 1.05rem; font-weight: 600; transition: color 0.3s ease; }
        .setting-card .description { font-size: 0.85rem; transition: color 0.3s ease; }
        .toggle-switch { width: 52px; height: 28px; border-radius: 40px; cursor: pointer; position: relative; transition: background 0.3s ease; flex-shrink: 0; }
        .toggle-switch.active { background: #1e293b; }
        .toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: white; border-radius: 50%; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .toggle-switch.active::after { transform: translateX(24px); }
        .status-text { font-size: 0.9rem; margin-left: 0.8rem; font-weight: 500; transition: color 0.3s ease; }

        .theme-selector { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.3rem; }
        .theme-dot { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.2s ease, transform 0.2s ease; flex-shrink: 0; }
        .theme-dot:hover { transform: scale(1.1); }
        .theme-dot.active { border-color: #ffffff; box-shadow: 0 0 12px rgba(255,255,255,0.3); }
        .theme-dot-light { background: #e8ecf0; border-color: #cbd5e1; }
        .theme-dot-dark { background: #1a1a2e; border-color: #2a3a5e; }
        .theme-dot-ocean { background: linear-gradient(135deg, #0c2340, #2e86c1); }
        .theme-dot-forest { background: linear-gradient(135deg, #0d2818, #2d6a4f); }
        .theme-dot-sakura { background: linear-gradient(135deg, #2d1b2e, #d4739d); }
        body.light-mode .theme-dot-light { border-color: #1e293b; }
        body.light-mode .theme-dot-light.active { border-color: #1e293b; box-shadow: 0 0 12px rgba(30,41,59,0.2); }
        .theme-label { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-top: 0.2rem; }

        @media (max-width: 768px) {
            .top-panel { padding: 0.6rem 1rem; }
            .panel-title { font-size: 0.9rem; }
            .panel-title img { width: 22px; height: 22px; }
            .panel-btn { padding: 0.3rem 0.8rem; font-size: 0.75rem; }
            .settings-page { padding: 80px 1.2rem 2rem; }
            .settings-title { font-size: 1.8rem; }
            .setting-card { padding: 1rem 1.2rem; flex-wrap: wrap; gap: 0.8rem; }
            .toggle-switch { width: 44px; height: 24px; }
            .toggle-switch::after { width: 18px; height: 18px; top: 3px; left: 3px; }
            .toggle-switch.active::after { transform: translateX(20px); }
            .theme-dot { width: 30px; height: 30px; }
        }
    </style>
</head>
<body class="light-mode">
    <div class="top-panel">
        <div class="panel-left">
            <span class="panel-title">
                <img src="fish/assets/fish/textures/Invicon_Tropical_Fish.png" alt="热带鱼" />
                摸鱼小镇
            </span>
            <a href="index.html" class="panel-btn">首页</a>
            <a href="members.html" class="panel-btn">玩家成员</a>
            <a href="settings.html" class="panel-btn" style="background: rgba(255,255,255,0.9);">设置</a>
        </div>
        <div class="panel-right"></div>
    </div>

    <div class="settings-page">
        <div class="settings-header">
            <div class="settings-title">设置</div>
            <div class="settings-subtitle">— 个性化你的小镇体验 —</div>
        </div>

        <div class="settings-container">
            <div class="setting-card">
                <div class="setting-info">
                    <span class="label">主题配色</span>
                    <span class="description">选择你喜欢的渐变风格</span>
                </div>
                <div class="theme-selector">
                    <div style="text-align:center;">
                        <div class="theme-dot theme-dot-light active" onclick="setTheme('light')" id="dot-light"></div>
                        <div class="theme-label">浅色</div>
                    </div>
                    <div style="text-align:center;">
                        <div class="theme-dot theme-dot-dark" onclick="setTheme('dark')" id="dot-dark"></div>
                        <div class="theme-label">深色</div>
                    </div>
                    <div style="text-align:center;">
                        <div class="theme-dot theme-dot-ocean" onclick="setTheme('ocean')" id="dot-ocean"></div>
                        <div class="theme-label">海洋蓝</div>
                    </div>
                    <div style="text-align:center;">
                        <div class="theme-dot theme-dot-forest" onclick="setTheme('forest')" id="dot-forest"></div>
                        <div class="theme-label">森林绿</div>
                    </div>
                    <div style="text-align:center;">
                        <div class="theme-dot theme-dot-sakura" onclick="setTheme('sakura')" id="dot-sakura"></div>
                        <div class="theme-label">樱花粉</div>
                    </div>
                </div>
            </div>

            <div class="setting-card">
                <div class="setting-info">
                    <span class="label">深色模式</span>
                    <span class="description">切换到深色主题，保护眼睛</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span class="status-text" id="themeStatus">关闭</span>
                    <div class="toggle-switch" id="themeToggle" onclick="toggleDarkMode()"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTheme = 'light';

        function setTheme(theme) {
            document.body.classList.remove('light-mode', 'dark-mode', 'ocean-mode', 'forest-mode', 'sakura-mode');
            document.body.classList.add(theme + '-mode');
            currentTheme = theme;

            document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
            const dotMap = {
                'light': 'dot-light',
                'dark': 'dot-dark',
                'ocean': 'dot-ocean',
                'forest': 'dot-forest',
                'sakura': 'dot-sakura'
            };
            const activeDot = document.getElementById(dotMap[theme]);
            if (activeDot) activeDot.classList.add('active');

            const toggle = document.getElementById('themeToggle');
            const status = document.getElementById('themeStatus');
            if (theme === 'dark') {
                toggle.classList.add('active');
                status.textContent = '开启';
            } else {
                toggle.classList.remove('active');
                status.textContent = '关闭';
            }

            localStorage.setItem('theme', theme);
        }

        function toggleDarkMode() {
            const toggle = document.getElementById('themeToggle');
            const status = document.getElementById('themeStatus');
            if (currentTheme === 'dark') {
                setTheme('light');
            } else {
                setTheme('dark');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        });

        window.addEventListener('storage', function(e) {
            if (e.key === 'theme') {
                setTheme(e.newValue || 'light');
            }
        });
    </script>
</body>
</html>
