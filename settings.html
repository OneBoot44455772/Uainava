<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸鱼小镇 - 设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #ffffff; transition: background-color 0.3s ease; }
        body { display: flex; flex-direction: column; align-items: center; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body.dark-mode { background: #1a1a2e; }
        body.dark-mode .top-panel { background: #16213e; }
        body.dark-mode .panel-title { color: #ffffff; }
        body.dark-mode .panel-btn { background: rgba(255,255,255,0.15); color: #ffffff; }
        body.dark-mode .panel-btn:hover { background: rgba(255,255,255,0.25); }
        body.dark-mode .settings-page { background: #1a1a2e; }
        body.dark-mode .settings-title { color: #ffffff; }
        body.dark-mode .settings-subtitle { color: #94a3b8; }
        body.dark-mode .setting-card { background: #16213e; border-color: #2a3a5e; }
        body.dark-mode .setting-card .label { color: #ffffff; }
        body.dark-mode .setting-card .description { color: #94a3b8; }
        body.dark-mode .toggle-switch { background: #2a3a5e; }
        body.dark-mode .toggle-switch.active { background: #4a6fa5; }
        body.dark-mode .status-text { color: #94a3b8; }
        .top-panel { width: 100%; background: #e8ecf0; border-radius: 0; padding: 1rem 2.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); flex-shrink: 0; position: fixed; top: 0; left: 0; z-index: 100; opacity: 0.92; transition: background-color 0.3s ease; }
        .panel-left { display: flex; align-items: center; gap: 1.5rem; }
        .panel-right { display: flex; align-items: center; gap: 1rem; }
        .panel-title { display: flex; align-items: center; gap: 0.5rem; color: #1e293b; font-size: 1.2rem; font-weight: 600; letter-spacing: 0.3px; transition: color 0.3s ease; }
        .panel-title img { width: 28px; height: 28px; display: block; }
        .panel-btn { border: none; border-radius: 9999px; padding: 0.5rem 1.6rem; font-size: 0.9rem; font-weight: 500; background: rgba(255,255,255,0.6); color: #1e293b; cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; }
        .panel-btn:hover { background: rgba(255,255,255,0.9); transform: translateY(-1px); }
        .settings-page { width: 100%; min-height: 100vh; padding: 100px 3rem 3rem; background: #ffffff; display: flex; flex-direction: column; align-items: center; transition: background-color 0.3s ease; }
        .settings-header { text-align: center; margin-bottom: 2.5rem; width: 100%; max-width: 700px; }
        .settings-title { font-size: 2.5rem; font-weight: 700; color: #1e293b; letter-spacing: 2px; transition: color 0.3s ease; }
        .settings-subtitle { font-size: 1rem; color: #94a3b8; margin-top: 0.3rem; transition: color 0.3s ease; }
        .settings-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1.2rem; }
        .setting-card { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border-radius: 30px; padding: 1.2rem 1.8rem; border: 1px solid #f1f5f9; transition: background-color 0.3s ease, border-color 0.3s ease; }
        .setting-info { display: flex; flex-direction: column; gap: 0.2rem; }
        .setting-card .label { font-size: 1.05rem; font-weight: 600; color: #1e293b; transition: color 0.3s ease; }
        .setting-card .description { font-size: 0.85rem; color: #94a3b8; transition: color 0.3s ease; }
        .toggle-switch { width: 52px; height: 28px; background: #cbd5e1; border-radius: 40px; cursor: pointer; position: relative; transition: background 0.3s ease; flex-shrink: 0; }
        .toggle-switch.active { background: #1e293b; }
        .toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: white; border-radius: 50%; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .toggle-switch.active::after { transform: translateX(24px); }
        .status-text { font-size: 0.9rem; color: #64748b; margin-left: 0.8rem; font-weight: 500; transition: color 0.3s ease; }
        @media (max-width: 768px) { .top-panel { padding: 0.6rem 1rem; } .panel-title { font-size: 0.9rem; } .panel-title img { width: 22px; height: 22px; } .panel-btn { padding: 0.3rem 0.8rem; font-size: 0.75rem; } .settings-page { padding: 80px 1.2rem 2rem; } .settings-title { font-size: 1.8rem; } .setting-card { padding: 1rem 1.2rem; flex-wrap: wrap; gap: 0.8rem; } .toggle-switch { width: 44px; height: 24px; } .toggle-switch::after { width: 18px; height: 18px; top: 3px; left: 3px; } .toggle-switch.active::after { transform: translateX(20px); } }
    </style>
</head>
<body>
    <div class="top-panel">
        <div class="panel-left">
            <span class="panel-title">
                <img src="fish/assets/fish/textures/Invicon_Tropical_Fish.png" alt="热带鱼" />
                摸鱼小镇
            </span>
            <a href="index.html" class="panel-btn">首页</a>
            <a href="members.html" class="panel-btn">玩家成员</a>
            <a href="settings.html" class="panel-btn" style="background: rgba(255,255,255,0.9);">设置</a>
        </div>
        <div class="panel-right"></div>
    </div>
    <div class="settings-page">
        <div class="settings-header">
            <div class="settings-title">设置</div>
            <div class="settings-subtitle">— 个性化你的小镇体验 —</div>
        </div>
        <div class="settings-container">
            <div class="setting-card">
                <div class="setting-info">
                    <span class="label">深色模式</span>
                    <span class="description">切换到深色主题，保护眼睛</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span class="status-text" id="themeStatus">关闭</span>
                    <div class="toggle-switch" id="themeToggle" onclick="toggleTheme()"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const body = document.body;
            const toggle = document.getElementById('themeToggle');
            const status = document.getElementById('themeStatus');
            body.classList.toggle('dark-mode');
            toggle.classList.toggle('active');
            const isDark = body.classList.contains('dark-mode');
            status.textContent = isDark ? '开启' : '关闭';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').classList.add('active');
                document.getElementById('themeStatus').textContent = '开启';
            }
        });
    </script>
</body>
</html>
