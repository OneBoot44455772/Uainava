<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸鱼小镇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #ffffff; scroll-behavior: smooth; transition: background-color 0.3s ease; }
        body { display: flex; flex-direction: column; align-items: center; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body.dark-mode { background: #1a1a2e; }
        body.dark-mode .top-panel { background: #16213e; }
        body.dark-mode .panel-title { color: #ffffff; }
        body.dark-mode .panel-btn { background: rgba(255,255,255,0.15); color: #ffffff; }
        body.dark-mode .panel-btn:hover { background: rgba(255,255,255,0.25); }
        body.dark-mode .background-section { background: #1a1a2e; }
        body.dark-mode .homepage { background: #1a1a2e; }
        body.dark-mode .homepage-title { color: #ffffff; }
        body.dark-mode .homepage-subtitle { color: #94a3b8; }
        body.dark-mode .intro-text { background: #16213e; border-color: #2a3a5e; color: #e2e8f0; }
        body.dark-mode .intro-text .highlight { color: #ffffff; }
        body.dark-mode .intro-text .signature { color: #94a3b8; }
        body.dark-mode .container img { background: #16213e; }
        .top-panel { width: 100%; background: #e8ecf0; border-radius: 0; padding: 1rem 2.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); flex-shrink: 0; position: fixed; top: 0; left: 0; z-index: 100; opacity: 0.92; transition: background-color 0.3s ease; }
        .panel-left { display: flex; align-items: center; gap: 1.5rem; }
        .panel-right { display: flex; align-items: center; gap: 1rem; }
        .panel-title { color: #1e293b; font-size: 1.2rem; font-weight: 600; letter-spacing: 0.3px; transition: color 0.3s ease; }
        .panel-btn { border: none; border-radius: 9999px; padding: 0.5rem 1.6rem; font-size: 0.9rem; font-weight: 500; background: rgba(255,255,255,0.6); color: #1e293b; cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; }
        .panel-btn:hover { background: rgba(255,255,255,0.9); transform: translateY(-1px); }
        #top { scroll-margin-top: 0; }
        .homepage-wrapper { width: 100%; scroll-margin-top: 0; }
        .background-section { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 60px; background: #ffffff; transition: background-color 0.3s ease; }
        .background-section img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .homepage { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 3rem; gap: 1.5rem; background: #ffffff; flex-shrink: 0; transition: background-color 0.3s ease; }
        .homepage-title { font-size: 2.5rem; font-weight: 700; color: #1e293b; letter-spacing: 2px; transition: color 0.3s ease; }
        .homepage-subtitle { font-size: 1rem; color: #94a3b8; margin-bottom: 0.5rem; transition: color 0.3s ease; }
        .content-row { display: flex; align-items: center; gap: 3rem; width: 100%; max-width: 1100px; justify-content: flex-start; padding-left: 5%; }
        .container { flex-shrink: 0; }
        .container img { display: block; width: 400px; height: 400px; border-radius: 30px; background: #ffffff; object-fit: contain; transition: background-color 0.3s ease; }
        .intro-text { font-size: 1.05rem; line-height: 2; color: #334155; max-width: 500px; background: #f8fafc; padding: 2rem 2.2rem; border-radius: 30px; border: 1px solid #f1f5f9; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
        .intro-text .highlight { font-weight: 600; color: #1e293b; transition: color 0.3s ease; }
        .intro-text .signature { margin-top: 0.8rem; font-style: italic; color: #64748b; font-size: 0.95rem; transition: color 0.3s ease; }
        @media (max-width: 900px) { .content-row { flex-direction: column; align-items: center; padding-left: 0; gap: 1.5rem; } .intro-text { max-width: 90%; font-size: 0.95rem; padding: 1.5rem; } }
        @media (max-width: 768px) { .top-panel { padding: 0.6rem 1rem; } .panel-title { font-size: 0.9rem; } .panel-btn { padding: 0.3rem 0.8rem; font-size: 0.75rem; } .background-section { margin-top: 50px; } .homepage-title { font-size: 1.8rem; } .homepage { padding: 1.5rem; } .container img { width: 280px; height: 280px; } .intro-text { font-size: 0.9rem; padding: 1.2rem; line-height: 1.8; } }
    </style>
</head>
<body>
    <div class="top-panel">
        <div class="panel-left">
            <span class="panel-title">🐠 控制面板</span>
            <a href="index.html" class="panel-btn">首页</a>
            <a href="members.html" class="panel-btn">玩家成员</a>
            <a href="settings.html" class="panel-btn">设置</a>
        </div>
        <div class="panel-right"></div>
    </div>
    <div class="homepage-wrapper" id="top">
        <div class="background-section">
            <img src="assets/fish/textures/background.png" alt="背景图" />
        </div>
        <div class="homepage">
            <div class="homepage-title">🏛️ 摸鱼小镇</div>
            <div class="homepage-subtitle">— 象征 · 传承 · 荣耀 —</div>
            <div class="content-row">
                <div class="container">
                    <img src="assets/fish/textures/Clownfish.png" alt="摸鱼小镇" />
                </div>
                <div class="intro-text">
                    <p><span class="highlight">摸鱼小镇</span>，自17th建立以来，便是一个以"快乐摸鱼，轻松玩耍"为宗旨的MC玩家组织。</p>
                    <p>我们佛系生存、互助共享、建筑自由，不肝不卷，快乐至上。人来人往，小镇常在。</p>
                    <p class="signature">摸鱼小镇会一直在那里，等你有一天忽然想回来看看——小镇的摸门，永远为你敞开。</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
        window.addEventListener('storage', function(e) {
            if (e.key === 'theme') {
                if (e.newValue === 'dark') {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            }
        });
    </script>
</body>
</html>
